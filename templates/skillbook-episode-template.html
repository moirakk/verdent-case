<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Verdent Skillbook Episode Template</title>
  <style>
    :root{
      --T: 28000;
      --black:#020403;
      --deep:#06120f;
      --panel:#071512;
      --signal:#49dca4;
      --strong:#7dffe0;
      --accent:#39f6ad;
      --cyan:#1fd6ff;
      --dim:#1f7c68;
      --warn:#ffb545;
      --red:#ff5347;
      --mono:"IBM Plex Mono","SFMono-Regular",Consolas,Menlo,monospace;
      --sans:Inter,"Helvetica Neue",Arial,sans-serif;
    }

    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{display:grid;place-items:center;color:var(--signal);font-family:var(--mono);-webkit-font-smoothing:antialiased}

    .stage{
      position:relative;
      width:min(100vw,calc(100vh * 9 / 16));
      height:min(100vh,calc(100vw * 16 / 9));
      max-width:1080px;
      max-height:1920px;
      aspect-ratio:9/16;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(88% 42% at 50% 18%,rgba(31,214,255,.08),transparent 62%),
        radial-gradient(82% 50% at 50% 64%,rgba(57,246,173,.12),transparent 66%),
        linear-gradient(180deg,#000 0%,var(--deep) 50%,var(--black) 100%);
    }

    .stage::before{
      content:"";
      position:absolute;inset:0;z-index:80;pointer-events:none;
      background:repeating-linear-gradient(0deg,rgba(73,220,164,.08) 0 1px,transparent 1px 4px);
      mix-blend-mode:screen;opacity:.48;
    }

    .stage::after{
      content:"";
      position:absolute;inset:0;z-index:81;pointer-events:none;
      background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.44) 78%,rgba(0,0,0,.84) 100%);
    }

    .grain{
      position:absolute;inset:-20%;z-index:79;pointer-events:none;opacity:.075;mix-blend-mode:screen;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='130' height='130'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='130' height='130' filter='url(%23n)'/></svg>");
      animation:grain .42s steps(3,end) infinite;
    }

    @keyframes grain{
      0%{transform:translate(0,0)}
      33%{transform:translate(-22px,14px)}
      66%{transform:translate(18px,-20px)}
      100%{transform:translate(0,0)}
    }

    .scanbeam{
      position:absolute;left:0;right:0;top:-12%;height:14%;z-index:84;pointer-events:none;opacity:.16;
      background:linear-gradient(to bottom,transparent,rgba(125,255,224,.08),rgba(125,255,224,.13),transparent);
      mix-blend-mode:screen;animation:sweep 8.4s linear infinite;
    }

    @keyframes sweep{to{top:108%}}

    .cam{
      position:absolute;inset:0;z-index:2;transform-origin:50% 47%;
      animation:camera calc(var(--T) * 1ms) linear infinite;
    }

    @keyframes camera{
      0%{transform:scale(1) translateY(0)}
      52%{transform:scale(1.045) translateY(-.2%)}
      100%{transform:scale(1.1) translateY(-.8%)}
    }

    .safe{
      position:absolute;inset:5.8% 6%;border:1px solid rgba(73,220,164,.2);
      box-shadow:0 0 0 1px rgba(125,255,224,.05),inset 0 0 44px rgba(57,246,173,.035);
      pointer-events:none;
    }

    .topbar{
      position:absolute;left:8%;right:8%;top:7.2%;z-index:10;
      display:flex;justify-content:space-between;gap:18px;
      color:rgba(125,255,224,.72);
      font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    }

    .act{
      position:absolute;left:8%;right:8%;top:12%;bottom:10%;z-index:8;
      opacity:0;transform:translateY(18px) scale(.985);will-change:opacity,transform;
    }

    .center{display:grid;place-items:center;text-align:center}
    .eyebrow{color:rgba(73,220,164,.68);font-size:12px;letter-spacing:.24em;text-transform:uppercase}
    h1,h2,p{margin:0}

    .hero{
      color:#effff7;
      font:800 54px/.94 var(--sans);
      letter-spacing:0;
      text-shadow:0 0 14px rgba(57,246,173,.42),0 0 30px rgba(31,214,255,.14);
    }

    .panel{
      border:1px solid rgba(125,255,224,.32);
      background:rgba(7,21,18,.76);
      padding:26px 24px;
      box-shadow:0 0 34px rgba(57,246,173,.1),inset 0 0 28px rgba(57,246,173,.04);
    }

    .verdent-logo{
      width:96px;height:96px;border-radius:24px;margin:0 auto 24px;
      display:grid;place-items:center;
      background:radial-gradient(circle at 44% 38%,#0b332e,#041814 62%,#010303);
      border:1px solid rgba(125,255,224,.24);
      box-shadow:0 0 34px rgba(57,246,173,.22),0 18px 36px rgba(0,0,0,.45);
    }

    .verdent-logo svg{width:58px;height:70px;filter:drop-shadow(0 0 13px rgba(57,246,173,.68))}

    .endline{
      margin-top:20px;color:rgba(125,255,224,.82);
      font-size:13px;line-height:1.6;letter-spacing:.16em;text-align:center;
    }

    .status{
      position:absolute;left:8%;right:8%;bottom:5.8%;z-index:10;
      display:flex;justify-content:space-between;gap:14px;
      border-top:1px solid rgba(73,220,164,.16);padding-top:12px;
      color:rgba(73,220,164,.56);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    }

    .fade{position:absolute;inset:0;z-index:90;background:#000;pointer-events:none}

    .hud{
      position:fixed;left:50%;bottom:18px;z-index:100;transform:translateX(-50%);
      display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:999px;
      background:rgba(2,4,3,.74);border:1px solid rgba(73,220,164,.22);
      color:rgba(125,255,224,.82);font:500 11px var(--mono);letter-spacing:.08em;
      transition:opacity .35s ease;
    }

    .hud.hide{opacity:0;pointer-events:none}
    .hud button{all:unset;cursor:pointer;border:1px solid rgba(73,220,164,.24);border-radius:999px;padding:5px 9px}
    .bar{width:128px;height:3px;background:rgba(73,220,164,.14);overflow:hidden;border-radius:2px}
    .bar i{display:block;width:0;height:100%;background:var(--accent);box-shadow:0 0 8px rgba(57,246,173,.7)}
    body.clean .hud{display:none}
    body.frozen *,body.frozen *::before,body.frozen *::after{animation-play-state:paused!important}
  </style>
</head>
<body>
  <main class="stage">
    <div class="grain"></div>
    <div class="scanbeam"></div>
    <div class="cam">
      <div class="safe"></div>
      <div class="topbar">
        <span>VERDENT SKILLBOOK // CASE 000</span>
        <span id="clock">00.00</span>
      </div>

      <section class="act center" id="scene1">
        <div>
          <div class="eyebrow">CASE FILE</div>
          <h1 class="hero">HOOK LINE</h1>
        </div>
      </section>

      <section class="act center" id="scene2">
        <div class="panel">
          <div class="eyebrow">INPUT</div>
          <h2 class="hero">MESSY INPUT</h2>
        </div>
      </section>

      <section class="act center" id="scene3">
        <div class="panel">
          <div class="eyebrow">SKILL RUNNING</div>
          <h2 class="hero">OUTPUT ARTIFACT</h2>
        </div>
      </section>

      <section class="act center" id="scene4">
        <div>
          <div class="verdent-logo" aria-label="Verdent logo">
            <svg viewBox="0 0 100 120" aria-hidden="true">
              <defs>
                <linearGradient id="leafA" x1="25" y1="8" x2="62" y2="98" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#75fff7"/>
                  <stop offset=".42" stop-color="#31f9bc"/>
                  <stop offset="1" stop-color="#b8ff7a"/>
                </linearGradient>
                <linearGradient id="leafB" x1="75" y1="26" x2="36" y2="112" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#16d8ff"/>
                  <stop offset=".52" stop-color="#18ecc3"/>
                  <stop offset="1" stop-color="#aaff78"/>
                </linearGradient>
              </defs>
              <path d="M47 8C30 21 18 36 15 52c-4 18 5 34 28 47 2 1 4 2 7 3-8-17-5-33 8-49 10-13 12-27-11-45Z" fill="url(#leafA)"/>
              <path d="M63 24c20 8 31 23 33 40 2 20-12 37-43 52 7-18 2-31-9-43 13-12 23-29 19-49Z" fill="url(#leafB)"/>
              <path d="M51 101c-3-19 1-33 13-48 7-9 9-19 5-29 14 18 8 39-8 55-6 7-9 14-10 22Z" fill="#021f1b" opacity=".76"/>
            </svg>
          </div>
          <div class="eyebrow">VERDENT SKILLBOOK</div>
          <div class="endline">ONE SKILL. ONE WORKFLOW. ONE ARTIFACT.</div>
        </div>
      </section>

      <div class="status">
        <span id="statusText">case file ready</span>
        <strong id="statusMode">SYSTEM</strong>
      </div>
    </div>
    <div class="fade" id="fade"></div>
  </main>

  <div class="hud" id="hud">
    <button id="play">PAUSE</button>
    <button id="replay">REPLAY</button>
    <div class="bar"><i id="bar"></i></div>
    <span id="time">0.00s</span>
  </div>

  <script>
    const T = 28000;
    const $ = s => document.querySelector(s);
    const clamp = (v,a=0,b=1)=>v<a?a:v>b?b:v;
    const smooth = t => { t=clamp(t); return t*t*(3-2*t); };
    function env(t,a,b,c,d){
      if(t<=a || t>=d) return 0;
      if(t<b) return smooth((t-a)/(b-a));
      if(t<=c) return 1;
      return smooth(1-(t-c)/(d-c));
    }

    const scenes = [
      ['scene1', 250, 650, 2500, 2950],
      ['scene2', 3000, 3420, 9000, 9550],
      ['scene3', 9600, 10020, 21000, 21600],
      ['scene4', 21600, 22100, 27800, 27990],
    ].map(([id,a,b,c,d])=>({el:$('#'+id),a,b,c,d}));

    const fade = $('#fade');
    const clock = $('#clock');
    const bar = $('#bar');
    const time = $('#time');
    let start = performance.now();
    let paused = false;
    let pausedAt = 0;

    function render(t){
      scenes.forEach(({el,a,b,c,d})=>{
        const o = env(t,a,b,c,d);
        el.style.opacity = o.toFixed(3);
        el.style.transform = `translateY(${((1-o)*18).toFixed(2)}px) scale(${(0.985+0.015*o).toFixed(4)})`;
      });
      const fo = t < 260 ? 1 : t < 720 ? 1 - smooth((t-260)/460) : t > T-420 ? smooth((t-(T-420))/390) : 0;
      fade.style.opacity = fo.toFixed(3);
      clock.textContent = (t/1000).toFixed(2).padStart(5,'0');
      bar.style.width = ((t/T)*100).toFixed(2)+'%';
      time.textContent = (t/1000).toFixed(2)+'s';
    }

    const qs = new URLSearchParams(location.search);
    if(qs.has('clean')) document.body.classList.add('clean');
    const freezeAt = qs.has('t') ? parseFloat(qs.get('t'))*1000 : null;
    if(freezeAt !== null){
      document.body.classList.add('frozen');
      if(!qs.has('hud')) document.body.classList.add('clean');
      const frame = Math.max(0,Math.min(T-1,freezeAt));
      render(frame);
      requestAnimationFrame(()=>render(frame));
      setTimeout(()=>render(frame),120);
    } else {
      requestAnimationFrame(frame);
    }

    function frame(now){
      if(!paused) render((now-start)%T);
      requestAnimationFrame(frame);
    }

    $('#play').onclick = ()=>{
      if(paused){
        start = performance.now() - pausedAt;
        paused = false;
        $('#play').textContent = 'PAUSE';
      } else {
        pausedAt = (performance.now()-start)%T;
        paused = true;
        $('#play').textContent = 'PLAY';
      }
    };
    $('#replay').onclick = ()=>{
      start = performance.now();
      pausedAt = 0;
      paused = false;
      $('#play').textContent = 'PAUSE';
    };
    let hideTimer;
    function poke(){
      $('#hud').classList.remove('hide');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(()=>$('#hud').classList.add('hide'),2200);
    }
    addEventListener('mousemove',poke);
    addEventListener('keydown',e=>{
      if(e.code==='Space'){e.preventDefault();$('#play').click();}
      if(e.key==='r'||e.key==='R') $('#replay').click();
      if(e.key==='c'||e.key==='C') document.body.classList.toggle('clean');
    });
    poke();
  </script>
</body>
</html>
