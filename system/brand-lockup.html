<!-- ============================================================
     LOCKED — Final Brand Lockup 动画逻辑。
     结尾前0.6s，brandmark 轻微放大+提亮，形成明确的"落版"节拍。
     这是 visual-system.md 里"a final brand lockup"要求的具体实现，
     三集必须用完全相同的曲线和时长，不要各集各改一套数值。
     ============================================================ -->
<script id="brand-lockup-js">
/*
  在每集的 render(t) 函数里，必须包含这一段（T 替换成该集实际总时长变量）：

  const lockup = smooth((t - (T-700)) / 500);
  brandmark.style.transform = `scale(${(1 + lockup*0.14).toFixed(3)})`;
  brandmark.style.opacity = (0.82 + lockup*0.18).toFixed(3);

  依赖：
  - brandmark = document.querySelector('.brandmark')
  - smooth(v) = 三次缓动函数，定义见下方 LOCKED 工具函数
*/
</script>

<!-- ============================================================
     LOCKED — 时间与缓动工具函数。三集共用同一套数学，
     保证"回弹弹入"手感完全一致，不要每集重新写一遍容易出偏差。
     ============================================================ -->
<script id="brand-motion-utils">
/*
const clamp = (v,a=0,b=1)=>v<a?a:v>b?b:v;
const smooth = v => { v=clamp(v); return v*v*(3-2*v); };
const backOut = x => { x=clamp(x); const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const env = (t,a,b,c,d)=>{
  if(t<=a || t>=d) return 0;
  if(t<b) return smooth((t-a)/(b-a));
  if(t<=c) return 1;
  return smooth(1-(t-c)/(d-c));
};
*/
</script>
