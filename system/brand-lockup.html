<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verdent Brand Lockup Reference</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
      :root {
        --black: #000000;
        --sage: #dce8de;
        --sage-shadow: #c5d0c7;
        --ink: #07170f;
        --muted: #637169;
        --line: rgba(7, 23, 15, 0.13);
        --brand: #16c58f;
        --brand-dark: #0c8f68;
        --mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: "Inter", Arial, sans-serif;
        --serif: "Fraunces", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--black);
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .stage {
        position: relative;
        width: min(100vw, 56.25vh);
        height: min(100vh, 177.777vw);
        aspect-ratio: 9 / 16;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 40%, rgba(22, 197, 143, 0.13), transparent 44%),
          linear-gradient(180deg, #020806 0%, #000000 24%, #000000 78%, #020806 100%);
        color: #eef6f1;
        font-family: var(--sans);
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.05) 0,
          rgba(255, 255, 255, 0.05) 1px,
          rgba(0, 0, 0, 0) 3px,
          rgba(0, 0, 0, 0) 7px
        );
        mix-blend-mode: soft-light;
        opacity: 0.34;
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        background:
          linear-gradient(115deg, transparent 0 34%, rgba(22, 197, 143, 0.12) 42%, transparent 54%),
          radial-gradient(circle at center, transparent 52%, rgba(0, 0, 0, 0.55) 100%);
      }

      .bar {
        position: absolute;
        left: 0;
        right: 0;
        z-index: 3;
        display: flex;
        padding-inline: 9%;
      }

      .bar.top {
        top: 0;
        height: 19%;
        align-items: flex-end;
        padding-bottom: 22px;
      }

      .bar.bottom {
        bottom: 0;
        height: 19%;
        align-items: flex-start;
        justify-content: space-between;
        padding-top: 22px;
      }

      .episode {
        color: rgba(238, 246, 241, 0.62);
        font: 700 15px / 1 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brandmark {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .ink-logo {
        display: block;
        flex: 0 0 auto;
        background: var(--brand);
        -webkit-mask: url("../assets/verdent-logo-ink.svg") center / contain no-repeat;
        mask: url("../assets/verdent-logo-ink.svg") center / contain no-repeat;
        filter: drop-shadow(0 0 10px rgba(22, 197, 143, 0.36));
      }

      .brandmark .ink-logo {
        width: 74px;
        height: 30px;
      }

      .brandmark span,
      .series-name {
        color: rgba(238, 246, 241, 0.76);
        font: 900 18px / 1 var(--sans);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .frame {
        position: absolute;
        left: 0;
        right: 0;
        top: 19%;
        bottom: 19%;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 9%;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.38), transparent 38%),
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.42), transparent 36%),
          var(--sage);
        box-shadow:
          inset 0 0 80px rgba(0, 0, 0, 0.12),
          0 0 54px rgba(22, 197, 143, 0.16);
      }

      .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        transform: translateX(-120%);
        animation: sweep 4.8s ease-in-out infinite;
        opacity: 0.55;
      }

      .result {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 18px;
      }

      .result-row {
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr);
        align-items: baseline;
        gap: 18px;
        padding-bottom: 17px;
        border-bottom: 1px solid var(--line);
      }

      .label {
        color: var(--muted);
        font: 900 17px / 1 var(--sans);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .value {
        color: var(--ink);
        font: 800 clamp(32px, 7vw, 48px) / 0.98 var(--serif);
        letter-spacing: 0;
      }

      .endline {
        margin-top: 10px;
        color: var(--ink);
        font: 900 17px / 1.25 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .page-logo {
        width: 210px;
        height: 72px;
        margin: 36px auto 0;
        background: var(--brand-dark);
        filter: none;
      }

      @keyframes sweep {
        0%,
        42% {
          transform: translateX(-120%);
        }
        72%,
        100% {
          transform: translateX(120%);
        }
      }

      @media (max-width: 460px) {
        .result-row {
          grid-template-columns: 72px minmax(0, 1fr);
          gap: 14px;
        }

        .value {
          font-size: clamp(30px, 8.6vw, 42px);
        }
      }
    </style>
  </head>
  <body>
    <!--
      Direct preview path from this file:
      ../assets/verdent-logo-ink.svg

      Episode path from series/skillbook/episodes/*.html:
      ../../../assets/verdent-logo-ink.svg
    -->
    <main class="stage" aria-label="Verdent brand lockup reference">
      <div class="bar top">
        <div class="episode">EP001 // PLAN MODE</div>
      </div>

      <section class="frame">
        <div class="result">
          <div class="result-row">
            <div class="label">Before</div>
            <div class="value">scattered intent</div>
          </div>
          <div class="result-row">
            <div class="label">After</div>
            <div class="value">executable plan</div>
          </div>
          <div class="result-row">
            <div class="label">Next</div>
            <div class="value">Design -> Visual System</div>
          </div>
          <div class="endline">One skill. One workflow. One artifact.</div>
          <span class="ink-logo page-logo" aria-label="Verdent logo"></span>
        </div>
      </section>

      <div class="bar bottom">
        <div class="brandmark">
          <span class="ink-logo" aria-hidden="true"></span>
          <span>Verdent</span>
        </div>
        <div class="series-name">Skillbook</div>
      </div>
    </main>
  </body>
</html>
